
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Event</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Find a College Event</h1>
    <p>Search for an event using its ID</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="list.html">All Events</a>
    <a href="listOne.html">Find Event</a>
    <a href="insert.html">Add Event</a>
    <a href="update.html">Update Event</a>
    <a href="delete.html">Delete Event</a>
</nav>

<main class="page-layout">
    <section class="content">
        <h2>Search Event</h2>

        <form id="searchForm">
            <label for="eventId">Event ID</label>
            <input type="number" id="eventId" min="1" required>
            <button type="submit">Search Event</button>
        </form>

        <div id="result" class="result-card" aria-live="polite"></div>
    </section>

    <img class="page-image" src="images/search.jpg" alt="Search Events">
         
</main>

<footer>College Event Management System</footer>

<script>
document.getElementById('searchForm').addEventListener(
    'submit', async function (e) {
        e.preventDefault();

        const id = document.getElementById('eventId').value;
        const result = document.getElementById('result');
        result.replaceChildren();

        try {
            const response = await fetch(
                '/events/' + encodeURIComponent(id)
            );
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || 'Event not found');
            }

            const heading = document.createElement('h3');
            heading.textContent = data.event_name;
            result.appendChild(heading);

            const details = [
                'Event ID: ' + data.event_id,
                'Date: ' + String(data.event_date).slice(0, 10),
                'Venue: ' + data.venue,
                'Description: ' + (data.description || 'Not provided')
            ];

            details.forEach(detail => {
                const p = document.createElement('p');
                p.textContent = detail;
                result.appendChild(p);
            });
        } catch (error) {
            result.textContent = error.message;
        }
    }
);
</script>
</body>
</html>
