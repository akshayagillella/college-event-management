
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Events</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>All College Events</h1>
    <p>Explore events scheduled at our college</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="list.html">All Events</a>
    <a href="listOne.html">Find Event</a>
    <a href="insert.html">Add Event</a>
    <a href="update.html">Update Event</a>
    <a href="delete.html">Delete Event</a>
</nav>

<main class="page-layout">
    <section class="content">
        <h2>Event List</h2>
        <p id="message" aria-live="polite"></p>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Event Name</th>
                        <th>Date</th>
                        <th>Venue</th>
                        <th>Description</th>
                    </tr>
                </thead>
                <tbody id="eventTable"></tbody>
            </table>
        </div>
    </section>

   <img class="page-image" src="images/events.jpg" alt="College Events">
</main>

<footer>College Event Management System</footer>

<script>
async function loadEvents() {
    const message = document.getElementById('message');
    const table = document.getElementById('eventTable');

    try {
        const response = await fetch('/events');

        if (!response.ok) {
            throw new Error('Unable to load events');
        }

        const events = await response.json();
        table.replaceChildren();

        if (events.length === 0) {
            message.textContent = 'No events found.';
            return;
        }

        message.textContent = '';

        events.forEach(event => {
            const row = document.createElement('tr');

            const values = [
                event.event_id,
                event.event_name,
                String(event.event_date).slice(0, 10),
                event.venue,
                event.description || ''
            ];

            values.forEach(value => {
                const cell = document.createElement('td');
                cell.textContent = value;
                row.appendChild(cell);
            });

            table.appendChild(row);
        });
    } catch (error) {
        message.textContent =
            error.message + '. Check whether the server and database are running.';
    }
}

loadEvents();
</script>
</body>
</html>
